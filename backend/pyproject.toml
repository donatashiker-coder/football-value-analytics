[project]
name = "football-value-analytics"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 200
target-version = "py312"
exclude = ["migrations/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108", "B905", "SIM102", "SIM103", "E731", "B023", "SIM105", "UP007", "UP038"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
