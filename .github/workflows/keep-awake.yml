# Render's free plan spins the service down after 15 minutes without traffic. The daily jobs run
# 06:00-07:05 Europe/London, so ping the health endpoint every 5 minutes around that window
# (04:50-07:20 UTC covers both GMT and BST). ~31 one-minute jobs/day stays inside the free Actions quota.
name: keep-awake
on:
  schedule:
    - cron: "50,55 4 * * *"
    - cron: "*/5 5-6 * * *"
    - cron: "0,5,10,15,20 7 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL repository variable not set"; exit 0; fi
          curl -fsS --max-time 120 --retry 3 --retry-delay 20 "$APP_URL/api/health" || echo "ping failed (service may still be waking up)"
