services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fva
      POSTGRES_PASSWORD: fva
      POSTGRES_DB: fva
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fva -d fva"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fva:fva@postgres:5432/fva
      REDIS_URL: redis://redis:6379/0
      CACHE_DIR: /app/data/cache
      SCHEDULER_ENABLED: "false"
    volumes:
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fva:fva@postgres:5432/fva
      REDIS_URL: redis://redis:6379/0
      CACHE_DIR: /app/data/cache
    command: ["python", "-m", "app", "scheduler"]
    volumes:
      - appdata:/app/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'app scheduler' >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

  worker:
    # one-shot data bootstrap (fixtures, statistics, odds, first scan); re-run with `docker compose run worker`
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fva:fva@postgres:5432/fva
      CACHE_DIR: /app/data/cache
    command: ["python", "-m", "app", "pipeline"]
    volumes:
      - appdata:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
  appdata:
